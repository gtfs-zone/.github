name: Commit check

# On a pull request: fails on any commit in the PR whose message is not a
# Conventional Commit. The commit-msg hook does the same locally but can be
# skipped. Does nothing on other events.

on:
  workflow_call:
    inputs:
      # Same version as the commit-msg hook in .pre-commit-config.yaml.
      commitizen-version:
        type: string
        default: "4.13.9"

permissions:
  contents: read

jobs:
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      # Full history and the PR head, not the merge commit, so only the PR's
      # own commits are in the range.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Check commit messages
        run: uvx --from "commitizen==${CZ_VERSION}" cz check --rev-range "origin/${BASE_REF}..HEAD"
        env:
          CZ_VERSION: ${{ inputs.commitizen-version }}
          BASE_REF: ${{ github.base_ref }}
