name: Node check

# Installs node and pnpm with mise (versions from the caller's .mise.toml),
# checks that packageManager in package.json names the same pnpm, then runs
# pnpm check.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install node and pnpm
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      - name: Check packageManager
        run: |
          want="pnpm@$(mise current pnpm)"
          have=$(jq -r '.packageManager // ""' package.json)
          case "$have" in
            "$want" | "$want+"*) echo "[node-check] packageManager: $have" ;;
            *) echo "[node-check] packageManager is '$have', .mise.toml pins $want" >&2; exit 1 ;;
          esac

      - name: Install node modules
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check
