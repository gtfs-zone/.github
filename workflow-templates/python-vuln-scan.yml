name: Vulnerability scan

# Scans uv.lock with scripts/vuln-gate.sh and fails on any critical finding.
# On main, the result is pushed to status.gtfs.zone.

on:
  push:
  pull_request:
  # Daily, so advisories published after the last push still show up.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vuln-scan:
    uses: gtfs-zone/.github/.github/workflows/vuln-scan.yml@8575dd846be98ade2c30822fd296c87fbf013053 # main
    with:
      lockfile: uv.lock
    secrets:
      gatus-token: ${{ secrets.GATUS_VULN_SCAN_TOKEN }}
